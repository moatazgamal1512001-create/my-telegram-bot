<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moataz Selfie Bot</title>
<style>
body{font-family:Arial,sans-serif;max-width:620px;margin:30px auto;padding:18px;background:#f5f6fa;color:#222}
main{background:white;padding:22px;border-radius:16px;box-shadow:0 3px 18px #0001}
video{width:100%;max-height:420px;background:#111;border-radius:12px;margin-top:12px}
button{padding:12px 16px;margin:6px;border:0;border-radius:9px;background:#1769aa;color:white;font-size:16px}
button:disabled{opacity:.45} #status{margin-top:14px;line-height:1.7}
.notice{background:#fff4d6;padding:12px;border-radius:10px}
</style>
</head>
<body><main>
<h2>Moataz Selfie Bot 📸</h2>
<p class="notice">هذه الصفحة تتيح لك التقاط صورة أو تسجيل فيديو وإرسالهما إلى صاحب رابط الدعوة. لن يتم تشغيل الكاميرا إلا بعد ضغطك على «تشغيل الكاميرا»، ولن يُرسل أي ملف إلا بعد ضغطك على «إرسال».</p>
<video id="preview" autoplay playsinline muted></video><br>
<button id="start">تشغيل الكاميرا الأمامية</button>
<button id="snap" disabled>التقاط صورة</button>
<button id="record" disabled>بدء تسجيل فيديو</button>
<button id="stop" disabled>إيقاف التسجيل</button>
<button id="send" disabled>إرسال آخر ملف</button>
<p id="status">لم يتم تشغيل الكاميرا.</p>
<canvas id="canvas" hidden></canvas>
</main>
<script>
const sid = {{ sid|tojson }};
const video = document.getElementById('preview');
const canvas = document.getElementById('canvas');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('start'), snapBtn = document.getElementById('snap');
const recBtn = document.getElementById('record'), stopBtn = document.getElementById('stop'), sendBtn = document.getElementById('send');
let stream=null, recorder=null, chunks=[], lastBlob=null, lastKind=null;

startBtn.onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}, audio:true});
    video.srcObject = stream;
    snapBtn.disabled = recBtn.disabled = false;
    statusEl.textContent = "الكاميرا تعمل. اختر التقاط صورة أو تسجيل فيديو.";
  } catch(e) { statusEl.textContent = "تعذر تشغيل الكاميرا/الميكروفون. راجع الأذونات واتصل عبر HTTPS."; }
};
snapBtn.onclick = () => {
  canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  canvas.toBlob(blob => { lastBlob=blob; lastKind="photo"; sendBtn.disabled=false; statusEl.textContent="تم التقاط صورة. اضغط إرسال لإرسالها."; }, "image/jpeg", .92);
};
recBtn.onclick = () => {
  chunks=[];
  const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp8,opus") ? "video/webm;codecs=vp8,opus" : "";
  recorder = new MediaRecorder(stream, mime ? {mimeType:mime} : {});
  recorder.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
  recorder.onstop = () => { lastBlob=new Blob(chunks,{type:recorder.mimeType || "video/webm"}); lastKind="video"; sendBtn.disabled=false; statusEl.textContent="تم تجهيز الفيديو. اضغط إرسال لإرساله."; };
  recorder.start(); recBtn.disabled=true; stopBtn.disabled=false; statusEl.textContent="جارٍ التسجيل. اضغط إيقاف عند الانتهاء.";
};
stopBtn.onclick = () => { if(recorder && recorder.state!=="inactive") recorder.stop(); recBtn.disabled=false; stopBtn.disabled=true; };
sendBtn.onclick = async () => {
  if(!lastBlob) return;
  sendBtn.disabled=true; statusEl.textContent="جارٍ الإرسال...";
  const form=new FormData();
  form.append("media", lastBlob, lastKind==="photo" ? "selfie.jpg" : "video.webm");
  form.append("kind",lastKind);
  try {
    const r=await fetch(`/upload/${sid}`,{method:"POST",body:form});
    const data=await r.json();
    if(!r.ok || !data.ok) throw new Error(data.error || "فشل الإرسال");
    statusEl.textContent="تم الإرسال بنجاح. يمكنك التقاط ملف آخر وإرساله.";
    lastBlob=null;
  } catch(e) { statusEl.textContent="لم يتم الإرسال: "+e.message; sendBtn.disabled=false; }
};
window.addEventListener("beforeunload",()=>{ if(stream) stream.getTracks().forEach(t=>t.stop()); });
</script>
</body></html>
